---
#------------------------------------------------------------------------------
# Run the SDK's unit tests, with coverage.
#
# The unit tests never reach a Smarter platform: an httpx MockTransport answers
# every request. The live tests (tests/live/) are skipped, because
# SMARTER_TEST_LIVE is not set.
#------------------------------------------------------------------------------
name: Test
branding:
  icon: "check-circle"
  color: "green"
inputs:
  python-version:
    description: "The Python version to test with"
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: requirements/*.txt

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base.txt coverage==7.6.10

    - name: Run the unit tests
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        coverage run --rcfile=smarter/.coveragerc -m unittest discover -s tests -t .
        coverage report -m --rcfile=smarter/.coveragerc --fail-under=90
        coverage xml --rcfile=smarter/.coveragerc -o coverage.xml

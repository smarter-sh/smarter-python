---
#------------------------------------------------------------------------------
# Build the package's sdist and wheel, and check them with twine.
#
# Publishing to PyPI is done by hand: make publish-test, make publish-prod.
#------------------------------------------------------------------------------
name: Build
branding:
  icon: "package"
  color: "orange"
inputs:
  python-version:
    description: "The Python version to build with"
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Build
      shell: bash
      run: |
        python -m pip install --upgrade pip build twine
        python -m build --sdist --wheel ./
        twine check dist/*

    - name: Upload the distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
